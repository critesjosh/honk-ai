<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ask Aztec — privacy network assistant</title>
    <meta
      name="description"
      content="Ask anything about the Aztec privacy network — RAG assistant grounded in Aztec's public docs."
    />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/ask/favicon.png" />
    <!-- Google Fonts — open-source stand-ins for the licensed Aztec
         typefaces (see src/styles/colors_and_type.css). Loaded here
         instead of a CSS @import so the font CSS fetch starts in
         parallel with the bundle rather than serialized behind it.
         CSP: style-src allows fonts.googleapis.com, font-src allows
         fonts.gstatic.com (nginx.conf). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Martel:wght@300;400;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
