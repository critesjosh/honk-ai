server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Caddy preserves the /ask prefix when proxying. Vite builds with
    # `base: "/ask/"`, so emitted asset URLs are /ask/assets/*.
    # Hashed bundles are immutable.
    location ~* ^/ask/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback under /ask: anything not a hashed asset → index.html.
    location /ask {
        try_files $uri $uri/ /ask/index.html;
    }

    # index.html must not be cached.
    location = /ask/index.html {
        add_header Cache-Control "no-store";
        # Static-asset CSP. The bundle only fetches its own assets,
        # streams from same-origin /stream, and pulls Google Fonts CSS
        # for the open-source type stand-ins. No inline scripts (Vite
        # emits hashed module preloads); inline styles are required for
        # CSS variables and a small amount of inline `style=` props.
        # `__ASK_CONNECT_SRC__` is replaced at build time by the Dockerfile
        # via sed. Default is `'self'` (production: same-origin /stream).
        # Dev compose overrides to also allow `http://localhost:7091` so
        # the localhost smoke-test can reach the backend cross-origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src __ASK_CONNECT_SRC__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Content-Type-Options "nosniff";
    }
}
