server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset files are immutable; cache hard.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths resolve to index.html so client router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must not be cached so deploys roll out atomically.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
