name: Python linting

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

# Cancel an in-flight run when a fixup push lands seconds later.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint with Ruff
        # chartboost/ruff-action is archived; astral-sh/ruff-action is the
        # maintained successor. Pinned to the v4.0.0 release commit.
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
