name: Python linting

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

# Cancel an in-flight run when a fixup push lands seconds later.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint with Ruff
        # chartboost/ruff-action is archived; astral-sh/ruff-action is the
        # maintained successor. Pinned to the v4.0.0 release commit.
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
