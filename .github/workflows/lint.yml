name: Python linting

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

# Cancel an in-flight run when a fixup push lands seconds later.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint with Ruff
        uses: chartboost/ruff-action@v1
