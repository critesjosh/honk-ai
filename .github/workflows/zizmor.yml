name: GitHub Actions Security Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest

    permissions:
      contents: read # Required to check out the repo under the workflow-level `permissions: {}` deny-by-default.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@71321a20a9ded102f6e9ce5718a2fcec2c4f70d8 # v0.5.2
        # Advisory only: upstream runs this action with SARIF upload, which
        # swallows zizmor's non-zero exit when findings exist. Code Scanning
        # requires GHAS on private repos, which this fork doesn't have, so
        # we turn the upload off and let the audit run without gating merges
        # on pre-existing findings in inherited upstream workflows.
        continue-on-error: true
        with:
          advanced-security: false
