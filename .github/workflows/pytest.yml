name: Run python tests with pytest
on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when a fixup push lands seconds later.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest_and_coverage:
    name: Run tests and count coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            application/requirements.txt
            tests/requirements.txt
      - name: Ensure PostgreSQL binaries are present
        # The pg fixtures SKIP (not error) when pg_config is missing, so a
        # runner image without Postgres would go green while silently
        # skipping all ~570 database tests. Fail loudly instead.
        run: pg_config --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd application
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          cd ../tests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Test with pytest and generate coverage report
        run: |
          python -m pytest --cov=application --cov-report=xml --cov-report=term-missing
      - name: Upload coverage reports to Codecov
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
