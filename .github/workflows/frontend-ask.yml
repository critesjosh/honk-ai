name: Frontend /ask lint and build

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when a fixup push lands seconds later.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint_and_build:
    name: Lint and build frontend-ask
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-ask
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-ask/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
