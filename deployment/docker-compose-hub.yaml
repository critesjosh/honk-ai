# Production compose for the Aztec fork of DocsGPT.
#
# Differences from upstream:
#  - builds images from local source (not :develop pulls)
#  - postgres uses pgvector (user data + vector store in one database)
#  - only Caddy publishes host ports; postgres/redis/backend/frontend
#    stay on the internal compose network
#  - secrets come from ../.env (generate via: openssl rand -hex 32)
#
# First-boot bootstrap (see AZTEC_SETUP.md):
#   docker compose -f deployment/docker-compose-hub.yaml up -d postgres
#   docker compose -f deployment/docker-compose-hub.yaml run --rm backend python scripts/db/init_postgres.py
#   docker compose -f deployment/docker-compose-hub.yaml up -d

name: docsgpt-aztec
services:

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Loopback-only host port for the SSH reverse tunnel to ci-bastion.
    # 127.0.0.1 (NOT 0.0.0.0) — never publicly reachable on josh-box.
    # The systemd-user service `aztec-docs-tunnel` (file outside this
    # repo, on josh-box at ~/.config/systemd/user/) carries this port to
    # bastion's localhost:5080, where cloudflared on bastion picks it
    # up and serves it to Cloudflare. See PLAN-bastion-relay.md.
    ports:
      - "127.0.0.1:5080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - PUBLIC_HOSTNAME=${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME must be set in .env}
    depends_on:
      - backend
      - frontend-ask

  # Public-facing /ask landing page. Separate Vite/React bundle from the
  # admin frontend; same origin via Caddy `handle /ask/*`. Bearer key
  # baked at build time — see scripts/db/create_ask_aztec_public_agent.py
  # for how the agent is provisioned with hard request/token caps.
  frontend-ask:
    build:
      context: ../frontend-ask
      dockerfile: Dockerfile.prod
      args:
        VITE_ASK_AZTEC_AGENT_KEY: ${VITE_ASK_AZTEC_AGENT_KEY:?VITE_ASK_AZTEC_AGENT_KEY must be set in .env (run scripts/db/create_ask_aztec_public_agent.py first)}
    image: aztec/docsgpt-ask:${IMAGE_TAG:-0.17.0-aztec.1}
    restart: unless-stopped
    # No host port; Caddy reaches frontend-ask:80 on the internal network.
    depends_on:
      - backend

  backend:
    build:
      context: ../application
    image: aztec/docsgpt:${IMAGE_TAG:-0.17.0-aztec.1}
    restart: unless-stopped
    # Allow Gunicorn --graceful-timeout 30 to actually drain long SSE
    # streams on `up -d --force-recreate backend`. Compose default is 10s.
    stop_grace_period: 40s
    env_file:
      - ../.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CACHE_REDIS_URL=redis://redis:6379/2
      - POSTGRES_URI=postgresql://docsgpt:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/docsgpt
      - PGVECTOR_CONNECTION_STRING=postgresql://docsgpt:${POSTGRES_PASSWORD}@postgres:5432/docsgpt
      - VECTOR_STORE=${VECTOR_STORE:-pgvector}
      - TIKTOKEN_CACHE_DIR=/tmp/tiktoken_cache
      - FLASK_DEBUG=false
    volumes:
      # Persist raw uploads across container recreation.
      - uploads:/app/application/inputs
      # Live-mount model config so operators can tune model settings without rebuild.
      - ../application/core/model_configs.py:/app/application/core/model_configs.py:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../application
    image: aztec/docsgpt:${IMAGE_TAG:-0.17.0-aztec.1}
    restart: unless-stopped
    # Beat is co-located via -B. ``--schedule`` points the schedule
    # state file at /tmp because the worker image runs as ``appuser``
    # without write access to the default CWD (/app); without this,
    # beat fails on boot with ``Permission denied: 'celerybeat-schedule'``
    # and the periodic retention/cleanup tasks never fire.
    command: celery -A application.app.celery worker -l INFO -B --schedule=/tmp/celerybeat-schedule -c 2
    env_file:
      - ../.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - API_URL=http://backend:7091
      - CACHE_REDIS_URL=redis://redis:6379/2
      - POSTGRES_URI=postgresql://docsgpt:${POSTGRES_PASSWORD}@postgres:5432/docsgpt
      - PGVECTOR_CONNECTION_STRING=postgresql://docsgpt:${POSTGRES_PASSWORD}@postgres:5432/docsgpt
      - VECTOR_STORE=${VECTOR_STORE:-pgvector}
      - TIKTOKEN_CACHE_DIR=/tmp/tiktoken_cache
    volumes:
      - uploads:/app/application/inputs
      - ../application/core/model_configs.py:/app/application/core/model_configs.py:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  # Discord bot. Reaches backend:7091 internally so it bypasses
  # Cloudflare Access entirely (no service token needed). The bot calls
  # /stream for chat and /api/internal/create_mcp_key for the /mcp-key
  # slash command (self-auth via MCP_PROVISIONING_KEY).
  discord-bot:
    build:
      context: ../extensions/discord
    image: aztec/docsgpt-discord-bot:${IMAGE_TAG:-0.17.0-aztec.1}
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN:?DISCORD_TOKEN must be set in .env}
      - API_BASE=http://backend:7091
      - PUBLIC_HOSTNAME=${PUBLIC_HOSTNAME}
      - API_KEY=${API_KEY}
      - MCP_PROVISIONING_KEY=${MCP_PROVISIONING_KEY}
      - NOIR_GUILD_IDS=${NOIR_GUILD_IDS:-}
      - NOIR_GUILD_ID=${NOIR_GUILD_ID:-0}
    depends_on:
      - backend

  # MCP server (honk-ai-host MCP). Read-only SQL / RAG / logs surface
  # exposed to remote claudebox clients via Cloudflare Access. The
  # in-process bearer-token check (mcp_tokens table) is the second
  # layer; CF Access at the edge is the first. See AZTEC_SETUP.md for
  # the operator runbook (token issuance, scope wiring, Caddy/CF Access
  # route).
  mcp:
    build:
      context: ../application
    image: aztec/docsgpt-mcp:${IMAGE_TAG:-0.17.0-aztec.1}
    restart: unless-stopped
    command: ["python", "-m", "application.mcp_server"]
    env_file:
      - ../.env
    environment:
      # MCP_DB_URL is the read-only role bound to docsgpt_mcp_ro by
      # alembic 0006. .env should set MCP_DB_PASSWORD; we compose the
      # full URI here so operators rotate the password in one place.
      - MCP_DB_URL=postgresql://docsgpt_mcp_ro:${MCP_DB_PASSWORD:?MCP_DB_PASSWORD must be set in .env}@postgres:5432/docsgpt
      - MCP_DOCKER_PROXY_URL=http://docker-proxy:2375
      - MCP_COMPOSE_PROJECT=docsgpt-aztec
      - MCP_HOST=0.0.0.0
      - MCP_PORT=7092
    # Networks: ``default`` so Caddy + Postgres can reach us, and
    # ``docker_proxy_net`` so we can talk to the proxy. Backend/worker
    # are NOT on docker_proxy_net — a compromise of either of those
    # services should not give them an unauthenticated Docker API.
    networks:
      - default
      - docker_proxy_net
    # No host port — Caddy reaches mcp:7092 internally. External
    # clients reach the server through Caddy + Cloudflare Tunnel +
    # Cloudflare Access; see deployment/Caddyfile for the route.
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started

  # Read-only Docker Engine API proxy for the logs tool. LOGS=1 only.
  # See application/mcp_server/tools/logs.py for the access pattern.
  # Lives on its own network (docker_proxy_net) — only the mcp service
  # is attached. Tecnativa's documentation specifically warns against
  # sharing the proxy's network with other services because the proxy
  # itself is unauthenticated.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      - LOG_LEVEL=warn
      - CONTAINERS=1
      - LOGS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_proxy_net

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    # Internal-only; no host port publishing.

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=docsgpt
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=docsgpt
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsgpt -d docsgpt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:

networks:
  # Default compose network — backend, worker, frontend-ask, redis,
  # postgres, caddy, discord-bot, mcp.
  default:
  # Private network for the docker-socket-proxy. ONLY mcp + docker-proxy
  # are attached. Keeps backend/worker code-execution bugs from being
  # able to reach the unauthenticated proxy's Docker Engine surface.
  docker_proxy_net:
    internal: true
