name: docsgpt-oss
services:

  frontend:
    image: arc53/docsgpt-fe:develop
    network_mode: host
    environment:
      - VITE_API_HOST=http://localhost:7091
      - VITE_API_STREAMING=${VITE_API_STREAMING:-true}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend


  backend:
    user: root
    image: arc53/docsgpt:develop
    network_mode: host
    env_file:
      - ../.env
    environment:
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - CELERY_RESULT_BACKEND=redis://localhost:6379/1
      - MONGO_URI=mongodb://localhost:27017/docsgpt
      - CACHE_REDIS_URL=redis://localhost:6379/2
      - TIKTOKEN_CACHE_DIR=/tmp/tiktoken_cache
    volumes:
      - ../application:/app/application
      - ../application/indexes:/app/indexes
      - ../application/inputs:/app/inputs
      - ../application/vectors:/app/vectors
      - /tmp/tiktoken_cache:/tmp/tiktoken_cache
    depends_on:
      - redis
      - mongo


  worker:
    user: root
    image: arc53/docsgpt:develop
    network_mode: host
    command: celery -A application.app.celery worker -l INFO -B -c 2
    env_file:
      - ../.env
    environment:
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - CELERY_RESULT_BACKEND=redis://localhost:6379/1
      - MONGO_URI=mongodb://localhost:27017/docsgpt
      - API_URL=http://localhost:7091
      - CACHE_REDIS_URL=redis://localhost:6379/2
      - TIKTOKEN_CACHE_DIR=/tmp/tiktoken_cache
    volumes:
      - ../application/indexes:/app/indexes
      - ../application/inputs:/app/inputs
      - ../application/vectors:/app/vectors
      - /tmp/tiktoken_cache:/tmp/tiktoken_cache
      - ../application/core/model_configs.py:/app/application/core/model_configs.py
    depends_on:
      - redis
      - mongo

  redis:
    image: redis:6-alpine
    network_mode: host

  mongo:
    image: mongo:6
    network_mode: host
    volumes:
      - mongodb_data_container:/data/db

volumes:
  mongodb_data_container:
