[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage flags intentionally live in CI only (.github/workflows/pytest.yml
# passes --cov=application --cov-report=xml); local runs stay fast and don't
# regenerate htmlcov/.
addopts =
    -v
    --strict-markers
    --tb=short
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
